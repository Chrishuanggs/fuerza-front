name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Si el repo se llama <usuario>.github.io se publica en la raiz; si no, en /<repo>/.
      - name: Calcular base href
        run: |
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            echo "BASE_HREF=/" >> "$GITHUB_ENV"
          else
            echo "BASE_HREF=/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"
          fi

      - run: npx ng build --configuration production --base-href "$BASE_HREF"

      # GitHub Pages sirve 404.html en rutas desconocidas; con una copia de index.html el router de Angular resuelve /rango, /coach, etc.
      - run: cp dist/fuerza-front/browser/index.html dist/fuerza-front/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/fuerza-front/browser

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
